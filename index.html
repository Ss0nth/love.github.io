<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>I LOVE U</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container">
      <div class="envelope-wrapper">
        <div class="envelope">
          <div class="letter">
            <div class="text">
              <strong>Holis</strong>
              <p>
                Gracias, llegaste cuando no buscaba a nadie y aun así le diste vida a páginas
                del libro de mi historia que estaban en silencio. Con tu forma de ser hiciste
                que muchos días se sintieran distintos, más ligeros, más reales. 
                Te aprecio un montón, de verdad
              </p>
            </div>
          </div>
        </div>
        <div class="heart"></div>
      </div>
    </div>
    <audio id="audio" autoplay>
      <source src="river.mp3" type="audio/mpeg" />
    </audio>
    <script>
      const envelope = document.querySelector(".envelope-wrapper");
      envelope.addEventListener("click", () => {
        envelope.classList.toggle("flap");
      });

  
      const audio = document.getElementById("audio");

      
      audio.volume = 0.2;

      audio.addEventListener("timeupdate", function () {
        if (audio.currentTime >= 30) {
          audio.pause();
        }
      });
    </script>
  </body>
</html>
